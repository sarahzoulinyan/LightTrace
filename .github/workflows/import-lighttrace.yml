name: Import LightTrace source

on:
  push:
    paths:
      - ".github/workflows/import-lighttrace.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out LightTrace
        uses: actions/checkout@v4

      - name: Import source and apply LightTrace branding
        shell: bash
        run: |
          set -euo pipefail
          cp README.md /tmp/LightTrace-README.md
          git clone --depth 1 https://github.com/uf-robopi/LightViz.git /tmp/LightTrace-source
          rsync -a --delete --exclude='.git' --exclude='.github' /tmp/LightTrace-source/ ./
          cp /tmp/LightTrace-README.md README.md
          sed -i 's/^name: lightviz$/name: lighttrace/' environment.yml
          sed -i 's/self\.win\.title("LightViz")/self.win.title("LightTrace")/' main.py
          sed -i 's/<title>LightViz<\/title>/<title>LightTrace<\/title>/' src/example_directdraw.html
          rm -f .github/workflows/import-lighttrace.yml
          rmdir .github/workflows .github 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Import source, rename project to LightTrace, and expand README"
          git push
